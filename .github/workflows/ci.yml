name: CI

# 两层门禁，刻意分开：
#   offline   —— 每次 push / PR 都跑，零 API 成本，几分钟内出结果
#   model-eval —— 只有手动触发才跑，要花额度，默认不挡合并
#
# 为什么不把生成层放进每次 push：
#   1. 100 题一次约 ￥0.37，一天二十次 push 就是几块钱，且慢（3 分钟起）
#   2. fork / PR 拿不到 secret，会把 CI 长期跑红 —— 长期红的门禁等于没有门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: 离线门禁（零 API 成本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖（只装轻依赖，不含 torch）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt

      - name: 语法检查
        run: |
          python -c "import ast,glob;fs=[f for f in glob.glob('**/*.py',recursive=True) if '.venv' not in f and '.models' not in f];[ast.parse(open(f,encoding='utf-8').read(),f) for f in fs];print(f'{len(fs)} 个文件语法通过')"

      - name: 导入检查
        # 报 NameError / ImportError 的地方，通常是改了签名没改调用方
        run: python -c "import retrieval, hybrid, tools, rag; print('import ok')"

      - name: 降级链离线断言
        # 12 项：缓存指纹、403 降级、降级不入缓存、代码 bug 不许被吞
        run: python eval/test_degrade.py

      - name: 检索层门禁
        # 纯 BM25，不调 embedding：库内 74/78、top1 71/78、平均取回 965 字
        # 低于基线即红 —— 切分和 tokenize 最容易在界面上看不出来地改坏召回
        run: python eval/eval_retrieval.py

      - name: HTTP 接口断言
        # 31 项，全用桩：SSE 帧格式、故障转 503、工具摘要不含个人信息、降级不空屏
        # 不调模型 —— 接口层的错（字段改名、状态码写错）本来就不该靠跑模型才发现
        run: python eval/test_api.py

  model-eval:
    name: 生成层冒烟（手动触发，消耗额度）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑 10 题
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          MODEL: ${{ secrets.MODEL }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::warning::没配 DASHSCOPE_API_KEY，跳过生成层。这是配置缺失，不是代码失败。"
            exit 0
          fi
          python eval/smoke10.py
